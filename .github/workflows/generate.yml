name: Generate and Publish Protos

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Buf lint
        run: buf lint
      
      - name: Generate Go code
        run: buf generate --template buf.gen.go.yaml
      
      - name: Generate Rust code
        run: buf generate --template buf.gen.rust.yaml
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Create Go module with version
        run: |
          cd gen/go
          
          # Initialize go.mod
          cat > go.mod << 'EOF'
          module github.com/harvesthub-gardening-tool/protos-go
          
          go 1.24
          
          require (
            connectrpc.com/connect v1.19.1
            google.golang.org/protobuf v1.36.10
          )
          EOF
          
          go mod tidy
      
      - name: Commit and push generated code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gen/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: regenerate proto code [skip ci]" && git push)
      
      - name: Create Go package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Tag for Go module (pseudo-version or actual tag)
          VERSION=$(git describe --tags --always)
          cd gen/go
          git tag "go/${VERSION}" 2>/dev/null || true
          git push origin "go/${VERSION}" 2>/dev/null || true
