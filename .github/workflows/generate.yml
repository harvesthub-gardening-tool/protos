name: Generate and Publish Protos
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint

      - name: Generate Go code
        run: buf generate --template buf.gen.go.yaml

      # - name: Generate Rust code
      # run: buf generate --template buf.gen.rust.yaml

      - name: Generate OpenAPI/Swagger docs
        run: buf generate --template buf.gen.docs.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Create Go module with version
        run: |
          cd gen/go

          # Determine version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0-$(git rev-parse --short HEAD)"
          fi

          cat > go.mod << EOF
          module github.com/harvesthub-gardening-tool/protos-go

          go 1.23

          require (
            connectrpc.com/connect v1.19.1
            google.golang.org/protobuf v1.36.10
          )
          EOF

          go mod tidy

      - name: Publish Go module to separate repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine version
          VERSION="v0.0.0-$(git rev-parse --short HEAD)"
          
          # Clone or create the protos-go repository
          cd /tmp
          if gh repo view harvesthub-gardening-tool/protos-go >/dev/null 2>&1; then
            gh repo clone harvesthub-gardening-tool/protos-go
            cd protos-go
            git checkout main || git checkout -b main
          else
            mkdir protos-go
            cd protos-go
            git init -b main
            git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/harvesthub-gardening-tool/protos-go.git
          fi
          
          # Copy generated code
          rm -rf *
          cp -r ${{ github.workspace }}/gen/go/* .
          cp ${{ github.workspace }}/gen/go/go.mod .
          cp ${{ github.workspace }}/gen/go/go.sum .
          
          # Commit and push
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          if ! git diff --quiet --staged 2>/dev/null || ! git rev-parse HEAD >/dev/null 2>&1; then
            git commit -m "Generate proto code from ${{ github.sha }}"
            git push -f origin main
          else
            echo "No changes to publish"
          fi

      - name: Tag Go module version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Clone the protos-go repository
          cd /tmp
          gh repo clone harvesthub-gardening-tool/protos-go
          cd protos-go
          
          # Create and push version tag
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${VERSION}"
          git push origin "${VERSION}"
