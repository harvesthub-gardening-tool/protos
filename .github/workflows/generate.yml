name: Generate and Publish Protos
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint

      - name: Generate Go code
        run: buf generate --template buf.gen.go.yaml

      # - name: Generate Rust code
      # run: buf generate --template buf.gen.rust.yaml

      - name: Generate OpenAPI/Swagger docs
        run: buf generate --template buf.gen.docs.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Create Go module with version
        run: |
          cd gen/go

          # Determine version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0-$(git rev-parse --short HEAD)"
          fi

          cat > go.mod << EOF
          module github.com/harvesthub-gardening-tool/protos-go

          go 1.23

          require (
            connectrpc.com/connect v1.19.1
            google.golang.org/protobuf v1.36.10
          )
          EOF

          go mod tidy

      - name: Commit and push generated code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gen/

          if ! git diff --quiet --staged; then
            git commit -m "chore: regenerate proto code [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Create Go package tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          GO_TAG="go/${VERSION}"

          # Create and push tag for Go module
          git tag "${GO_TAG}"
          git push origin "${GO_TAG}"
