name: Generate Proto Code

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Proto Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint proto files
        run: buf lint

  generate-go:
    name: Generate Go Code
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate Go code
        run: buf generate --template buf.gen.go.yaml

      - name: Create Go module
        run: |
          chmod +x .github/scripts/create-go-module.sh
          .github/scripts/create-go-module.sh \
            "gen/go" \
            "github.com/harvesthub-gardening-tool/protos-go" \
            "${{ github.ref }}"

  generate-typescript:
    name: Generate TypeScript Code
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate TypeScript code
        run: buf generate --template buf.gen.typescript.yaml

      - name: Create TypeScript package
        run: |
          chmod +x .github/scripts/create-typescript-package.sh
          .github/scripts/create-typescript-package.sh \
            "gen/typescript" \
            "@harvesthub-gardening-tool/protos-typescript" \
            "${{ github.ref }}"

  generate-rust:
    name: Generate Rust Code
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Generate Rust code
        run: buf generate --template buf.gen.rust.yaml

      - name: Create Rust crate
        run: |
          chmod +x .github/scripts/create-rust-crate.sh
          .github/scripts/create-rust-crate.sh \
            "gen/rust" \
            "protos-rust" \
            "${{ github.ref }}"

  generate-docs:
    name: Generate Documentation
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OpenAPI docs
        run: buf generate --template buf.gen.docs.yaml
