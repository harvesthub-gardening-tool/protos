name: Publish Go Module

on:
  workflow_run:
    workflows: ["Generate Proto Code"]
    types: [completed]
    branches: ["**"]

permissions:
  contents: write

jobs:
  publish-go:
    name: Publish to protos-go Repository
    runs-on: ubuntu-latest
    # Run if generate workflow succeeded (works for both push and pull_request)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate Go code
        run: buf generate --template buf.gen.go.yaml

      - name: Create Go module
        run: |
          chmod +x .github/scripts/create-go-module.sh
          .github/scripts/create-go-module.sh \
            "gen/go" \
            "github.com/harvesthub-gardening-tool/protos-go" \
            "refs/heads/${{ github.event.workflow_run.head_branch }}"

      - name: Determine branch name
        id: branch
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "name=main" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to protos-go
        env:
          GH_TOKEN: ${{ secrets.PAT_PROTO_PUBLISH }}
        run: |
          chmod +x .github/scripts/publish-to-repo.sh
          .github/scripts/publish-to-repo.sh \
            "${{ github.workspace }}/gen/go" \
            "harvesthub-gardening-tool/protos-go" \
            "${{ steps.branch.outputs.name }}" \
            "${{ github.event.workflow_run.head_sha }}"

  cleanup-go:
    name: Cleanup Merged Branches
    runs-on: ubuntu-latest
    # Only cleanup when merging to main
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup merged branches
        env:
          GH_TOKEN: ${{ secrets.PAT_PROTO_PUBLISH }}
        run: |
          chmod +x .github/scripts/cleanup-merged-branches.sh
          .github/scripts/cleanup-merged-branches.sh \
            "harvesthub-gardening-tool/protos-go" \
            "harvesthub-gardening-tool/protos"

  tag-go:
    name: Tag Version in protos-go
    runs-on: ubuntu-latest
    # Only tag when pushing a version tag
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT

      - name: Create tag in protos-go
        env:
          GH_TOKEN: ${{ secrets.PAT_PROTO_PUBLISH }}
        run: |
          chmod +x .github/scripts/tag-version.sh
          .github/scripts/tag-version.sh \
            "harvesthub-gardening-tool/protos-go" \
            "${{ steps.version.outputs.tag }}"
