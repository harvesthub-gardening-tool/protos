syntax = "proto3";

package control.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/harvesthub-gardening-tool/protos-go/control/v1;controlv1";

// OpenAPI spec for the Control API v1
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Control API v1"
    version: "1.0"
    contact: {name: "Harvest Hub Project"}
    description: "Motor command queue API for MVP polling flow.\n\n**User flow:** User-authenticated clients enqueue commands and query status.\n**Hub flow:** Hubs poll for pending commands and acknowledge delivery/execution outcomes.\n\nThis MVP is intentionally polling-only and does not define streaming or push transport semantics."
  }
  schemes: [HTTP, HTTPS]
  consumes: ["application/json", "application/proto"]
  produces: ["application/json", "application/proto"]
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT token. Format: 'Bearer <token>'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
      value: {}
    }
  }
};

// ====== Service ======
service ControlService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Motor command queue API with user-created commands and hub-polled acknowledgements."
  };

  // User-created RPC: enqueue a motor command for a node behind a hub.
  rpc CreateMotorCommand(CreateMotorCommandRequest) returns (CreateMotorCommandResponse) {
    option (google.api.http) = {
      post: "/control.v1.ControlService/CreateMotorCommand"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "CreateMotorCommand (ControlService v1)"
      description: "Create a motor command idempotently for a target node. Intended for user-authenticated callers."
      tags: ["Control v1"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // User-created RPC: retrieve the current status of a previously-created command.
  rpc GetMotorCommandStatus(GetMotorCommandStatusRequest) returns (GetMotorCommandStatusResponse) {
    option (google.api.http) = {
      post: "/control.v1.ControlService/GetMotorCommandStatus"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetMotorCommandStatus (ControlService v1)"
      description: "Get the latest lifecycle state and reason fields for a command. Intended for user-authenticated callers."
      tags: ["Control v1"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // Hub-polled RPC: pull pending commands and lease them to the polling hub for bounded execution.
  rpc PullPendingMotorCommands(PullPendingMotorCommandsRequest) returns (PullPendingMotorCommandsResponse) {
    option (google.api.http) = {
      post: "/control.v1.ControlService/PullPendingMotorCommands"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "PullPendingMotorCommands (ControlService v1)"
      description: "Poll pending commands for the hub and return leased items for delivery to probes. Intended for hub-authenticated callers."
      tags: ["Control v1"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // Hub-ack RPC: acknowledge delivery/execution progress and terminal outcomes for a command.
  rpc AckMotorCommandEvent(AckMotorCommandEventRequest) returns (AckMotorCommandEventResponse) {
    option (google.api.http) = {
      post: "/control.v1.ControlService/AckMotorCommandEvent"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "AckMotorCommandEvent (ControlService v1)"
      description: "Acknowledge command lifecycle events from hubs, including non-terminal and terminal states with reason metadata."
      tags: ["Control v1"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }
}

// ====== Enums ======
enum MotorCommandAction {
  MOTOR_COMMAND_ACTION_UNSPECIFIED = 0;
  MOTOR_COMMAND_ACTION_RUN_FOR_DURATION = 1;
  MOTOR_COMMAND_ACTION_STOP = 2;
}

enum MotorCommandStatus {
  MOTOR_COMMAND_STATUS_UNSPECIFIED = 0; // Invalid/default value.
  MOTOR_COMMAND_STATUS_QUEUED = 1;
  MOTOR_COMMAND_STATUS_LEASED_TO_HUB = 2;
  MOTOR_COMMAND_STATUS_SENT_TO_PROBE = 3;
  MOTOR_COMMAND_STATUS_EXECUTING = 4;
  MOTOR_COMMAND_STATUS_SUCCEEDED = 5;
  MOTOR_COMMAND_STATUS_FAILED = 6;
  MOTOR_COMMAND_STATUS_EXPIRED = 7;
  MOTOR_COMMAND_STATUS_CANCELLED = 8;
}

enum MotorCommandReasonCode {
  MOTOR_COMMAND_REASON_CODE_UNSPECIFIED = 0; // NONE.
  MOTOR_COMMAND_REASON_CODE_NONE = 1;
  MOTOR_COMMAND_REASON_CODE_UNAUTHORIZED = 2;
  MOTOR_COMMAND_REASON_CODE_EXPIRED = 3;
  MOTOR_COMMAND_REASON_CODE_DUPLICATE = 4;
  MOTOR_COMMAND_REASON_CODE_PROBE_UNREACHABLE = 5;
  MOTOR_COMMAND_REASON_CODE_BLE_WRITE_FAILED = 6;
  MOTOR_COMMAND_REASON_CODE_UART_TIMEOUT = 7;
  MOTOR_COMMAND_REASON_CODE_UART_REJECTED = 8;
  MOTOR_COMMAND_REASON_CODE_SAFETY_LIMIT_EXCEEDED = 9;
}

// ====== Messages ======
message MotorCommand {
  string command_id            = 1;
  string idempotency_key       = 2;
  string hub_id                = 3;
  string node_id               = 4;
  MotorCommandAction action    = 5;
  int32 duration_ms            = 6;
  string requested_by_user_id  = 7;
  int64 created_at             = 8;  // Unix milliseconds
  int64 expires_at             = 9;  // Unix milliseconds
  int64 lease_expires_at       = 10; // Unix milliseconds, 0 when not leased
  MotorCommandStatus status    = 11;
  MotorCommandReasonCode reason_code = 12;
  string reason_message        = 13;
}

message CreateMotorCommandRequest {
  string idempotency_key       = 1;
  string hub_id                = 2;
  string node_id               = 3;
  MotorCommandAction action    = 4;
  int32 duration_ms            = 5;
  int64 expires_at             = 6; // Unix milliseconds
}

message CreateMotorCommandResponse {
  MotorCommand command = 1;
}

message GetMotorCommandStatusRequest {
  string command_id = 1;
}

message GetMotorCommandStatusResponse {
  MotorCommand command = 1;
}

message PullPendingMotorCommandsRequest {
  string hub_id            = 1;
  int32 max_commands       = 2;
  int32 lease_duration_ms  = 3;
}

message PullPendingMotorCommandsResponse {
  repeated MotorCommand commands = 1;
}

message AckMotorCommandEventRequest {
  string command_id                 = 1;
  string hub_id                     = 2;
  string node_id                    = 3;
  MotorCommandStatus status         = 4;
  MotorCommandReasonCode reason_code = 5;
  string reason_message             = 6;
}

message AckMotorCommandEventResponse {
  MotorCommand command = 1;
}
