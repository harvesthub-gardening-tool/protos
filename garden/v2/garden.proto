syntax = "proto3";

package garden.v2;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/harvesthub-gardening-tool/protos-go/garden/v2;gardenv2";

// OpenAPI spec for the Garden API v2
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Garden API v2"
    version: "2.0"
    contact: {name: "Harvest Hub Project"}
    description: "API to collect and consult garden sensor data.\n\n**v2 changes:**\n- Adds optional `hub_id` filter to GetSummary (lets clients scope queries to a single hub).\n- Each `SensorSummary` now carries the `hub_id` of the hub that owns the probe.\n\n**Authentication:** All endpoints require Bearer token authentication (user JWT for reads, hub JWT for writes)."
  }
  schemes: [HTTP, HTTPS]
  consumes: ["application/json", "application/proto"]
  produces: ["application/json", "application/proto"]
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT token. Format: 'Bearer <token>'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
      value: {}
    }
  }
};

// ====== Service ======
service GardenService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Service for collecting and retrieving garden sensor data (v2)."
  };

  // Insert a new sensor measurement. Hub-only.
  rpc InsertSensorData(InsertSensorDataRequest) returns (InsertSensorDataResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/InsertSensorData"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "InsertSensorData (GardenService v2)"
      description: "Insert a sensor measurement. Requires a hub service-account JWT carrying a `hub_id` claim. The probe is auto-bound to the calling hub on first sight; cross-hub spoofing is rejected."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // Read aggregated sensor data scoped to the caller's hubs.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/GetSummary"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetSummary (GardenService v2)"
      description: "Aggregate sensor readings over a sliding window. Users only see data from probes attached to hubs they own. Optional `hub_id` filter narrows the scope to a single hub."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }
}

// ====== Messages ======
message InsertSensorDataRequest {
  string node_id       = 1; // Probe identifier (BLE MAC or stable hardware ID)
  double temperature   = 2; // Celsius
  double humidity      = 3; // Percent (0-100)
  double soil_moisture = 4; // Percent (0-100)
  int64  timestamp     = 5; // Unix milliseconds
}

message InsertSensorDataResponse {
  bool   success = 1;
  string message = 2;
}

message GetSummaryRequest {
  optional string node_id = 1; // If empty, summarises across all nodes the caller owns.
  optional int32  hours   = 2; // Sliding window in hours (default 24).
  // Restrict the summary to a single hub owned by the caller. If unset, all hubs owned by the caller are included.
  optional string hub_id  = 3;
}

message GetSummaryResponse {
  repeated SensorSummary summaries = 1;
}

message SensorSummary {
  string node_id           = 1;
  int64  interval_start    = 2; // Unix milliseconds
  double avg_temperature   = 3;
  double avg_humidity      = 4;
  double avg_soil_moisture = 5;
  double max_temperature   = 6; // Celsius
  // ID of the hub that owns the probe (matches `hubs.id`).
  string hub_id            = 7;
}
