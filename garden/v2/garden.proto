syntax = "proto3";

package garden.v2;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/harvesthub-gardening-tool/protos-go/garden/v2;gardenv2";

// OpenAPI spec for the Garden API v2
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Garden API v2"
    version: "2.0"
    contact: {name: "Harvest Hub Project"}
    description: "API to collect and consult garden sensor data.\n\n**v2 changes:**\n- Adds optional `hub_id` filter to GetSummary (lets clients scope queries to a single hub).\n- Each `SensorSummary` now carries the `hub_id` of the hub that owns the probe.\n- Sensor readings use explicit air/soil metric names plus air pressure.\n\n**Authentication:** All endpoints require Bearer token authentication (user JWT for reads, hub JWT for writes)."
  }
  schemes: [HTTP, HTTPS]
  consumes: ["application/json", "application/proto"]
  produces: ["application/json", "application/proto"]
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT token. Format: 'Bearer <token>'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
      value: {}
    }
  }
};

// ====== Service ======
service GardenService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Service for collecting and retrieving garden sensor data (v2)."
  };

  // Insert a new sensor measurement. Hub-only.
  rpc InsertSensorData(InsertSensorDataRequest) returns (InsertSensorDataResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/InsertSensorData"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "InsertSensorData (GardenService v2)"
      description: "Insert a sensor measurement. Requires a hub service-account JWT carrying a `hub_id` claim. The probe is auto-bound to the calling hub on first sight; cross-hub spoofing is rejected."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // Read aggregated sensor data scoped to the caller's hubs.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/GetSummary"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetSummary (GardenService v2)"
      description: "Aggregate sensor readings over a sliding window. Users only see data from probes attached to hubs they own. Optional `hub_id` filter narrows the scope to a single hub."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // List all probes registered under a hub owned by the authenticated user. User-only.
  rpc ListProbesForHubName(ListProbesForHubNameRequest) returns (ListProbesForHubNameResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/ListProbesForHubName"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ListProbesForHubName (GardenService v2)"
      description: "List all probes (sensor nodes) registered to the hub identified by `hub_name` among the hubs owned by the authenticated user. The server resolves the hub by fetching all hubs for the caller and matching on name. Returns NOT_FOUND if no hub with that name belongs to the caller."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  // Return the most recent sensor reading for a probe owned by the caller. User-only.
  rpc GetLast(GetLastRequest) returns (GetLastResponse) {
    option (google.api.http) = {
      post: "/garden.v2.GardenService/GetLast"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetLast (GardenService v2)"
      description: "Returns the single most recent sensor reading for the given probe. The probe must be bound to a hub owned by the authenticated user; if the probe does not exist, has no data, or belongs to a different user, NOT_FOUND is returned. Only user JWTs are accepted."
      tags: ["Garden v2"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }
}

// ====== Messages ======
message InsertSensorDataRequest {
  string node_id           = 1; // Probe identifier (BLE MAC or stable hardware ID)
  double air_temperature   = 2; // Celsius
  double air_humidity      = 3; // Percent (0-100)
  double soil_humidity     = 4; // Percent (0-100)
  int64  timestamp         = 5; // Unix milliseconds
  double air_pressure      = 6; // Pascals
  double soil_temperature  = 7; // Celsius
}

message InsertSensorDataResponse {
  bool   success = 1;
  string message = 2;
}

message GetSummaryRequest {
  optional string node_id = 1; // If empty, summarises across all nodes the caller owns.
  optional int32  hours   = 2; // Sliding window in hours (default 24).
  // Restrict the summary to a single hub owned by the caller. If unset, all hubs owned by the caller are included.
  optional string hub_id  = 3;
}

message GetSummaryResponse {
  repeated SensorSummary summaries = 1;
}

message SensorSummary {
  string node_id               = 1;
  int64  interval_start        = 2; // Unix milliseconds
  double avg_air_temperature   = 3; // Celsius
  double avg_air_humidity      = 4; // Percent (0-100)
  double avg_soil_humidity     = 5; // Percent (0-100)
  double max_air_temperature   = 6; // Celsius
  // ID of the hub that owns the probe (matches `hubs.id`).
  string hub_id                = 7;
  double avg_air_pressure      = 8; // Pascals
  double avg_soil_temperature  = 9; // Celsius
}

message ListProbesForHubNameRequest {
  // Human-readable hub name (matched against the hub_name set during AssociateHub).
  string hub_name = 1;
}

message ProbeInfo {
  string node_id = 1; // Probe identifier (BLE MAC or stable hardware ID).
}

message ListProbesForHubNameResponse {
  repeated ProbeInfo probes = 1;
}

message SensorReading {
  string node_id           = 1; // Probe identifier (BLE MAC or stable hardware ID).
  int64  time              = 2; // Unix milliseconds of the reading timestamp.
  double air_temperature   = 3; // Celsius
  double air_pressure      = 4; // Pascals
  double air_humidity      = 5; // Percent (0-100)
  double soil_temperature  = 6; // Celsius
  double soil_humidity     = 7; // Percent (0-100)
}

message GetLastRequest {
  string node_id = 1; // Probe identifier (BLE MAC or stable hardware ID).
}

message GetLastResponse {
  SensorReading reading = 1;
}
