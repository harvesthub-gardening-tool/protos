syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/harvesthub-gardening-tool/protos-go/auth/v1;authv1";

// OpenAPI spec for the Auth API
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth API"
    version: "1.0"
    contact: {name: "Harvest Hub Project"}
    description: "API for user registration, login, and hub device token management.\n\n**Public endpoints:** Register, Login — no token required.\n**Protected endpoints:** CreateHubToken, ListHubTokens, RevokeHubToken — require a valid user Bearer token."
  }
  schemes: [HTTP, HTTPS]
  consumes: ["application/json", "application/proto"]
  produces: ["application/json", "application/proto"]
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "User JWT token. Format: 'Bearer <token>'"
      }
    }
  }
};

// ====== Service ======
service AuthService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "User authentication and hub device token management."
  };

  // Public — no token required
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/auth.v1.AuthService/Register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register (AuthService)"
      description: "Create a new user account. Returns a user JWT token valid for 24 hours."
      tags: ["Auth"]
      security: {} // public — no bearer required
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/auth.v1.AuthService/Login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login (AuthService)"
      description: "Validate credentials and return a user JWT token valid for 24 hours."
      tags: ["Auth"]
      security: {} // public — no bearer required
    };
  }

  // Protected — valid user token required
  rpc CreateHubToken(CreateHubTokenRequest) returns (CreateHubTokenResponse) {
    option (google.api.http) = {
      post: "/auth.v1.AuthService/CreateHubToken"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "CreateHubToken (AuthService)"
      description: "Create a hub device service account token valid for 1 year. The token is shown only once."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  rpc ListHubTokens(ListHubTokensRequest) returns (ListHubTokensResponse) {
    option (google.api.http) = {
      post: "/auth.v1.AuthService/ListHubTokens"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ListHubTokens (AuthService)"
      description: "List all active (non-revoked) hub tokens for the authenticated user."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }

  rpc RevokeHubToken(RevokeHubTokenRequest) returns (RevokeHubTokenResponse) {
    option (google.api.http) = {
      post: "/auth.v1.AuthService/RevokeHubToken"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "RevokeHubToken (AuthService)"
      description: "Revoke a hub token by ID. Revoked tokens are excluded from listings and rejected by the API."
      tags: ["Auth"]
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
    };
  }
}

// ====== Messages ======
message RegisterRequest {
  string email    = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string token   = 2;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message CreateHubTokenRequest {
  string hub_name = 1;
}

message CreateHubTokenResponse {
  string token = 1;
}

message ListHubTokensRequest {}

message HubTokenInfo {
  string id         = 1;
  string hub_name   = 2;
  int64  created_at = 3; // Unix milliseconds
  bool   revoked    = 4;
}

message ListHubTokensResponse {
  repeated HubTokenInfo tokens = 1;
}

message RevokeHubTokenRequest {
  string token_id = 1;
}

message RevokeHubTokenResponse {}
